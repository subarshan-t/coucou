name: NotchBuddy
options:
  bundleIdPrefix: au.com.purplegiraffe
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

# Giraffy is the Mac app only. The iPhone app, its widgets, the App Store build and
# the iPhone link (PHONE_LINK, iCloud, the upstream relay) are not part of this fork.
# FluidAudio (Apache-2.0): Parakeet speech-to-text and speaker diarization on the Mac's
# Neural Engine, for Flow dictation and the Notetaker. Its models are downloaded from
# Hugging Face only when the user clicks Download in Flow → Settings.
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # Prevent Xcode from scanning Swift source and rewriting Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    # Signed to run locally (ad hoc). scripts/dev-install.sh passes a team ID
    # (GIRAFFY_TEAM_ID) to sign with an Apple Development certificate instead,
    # which keeps macOS permissions across builds.
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/Giraffy.entitlements

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Giraffy
        CFBundleDisplayName: Giraffy
        CFBundleIdentifier: au.com.purplegiraffe.Giraffy
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Giraffy uses this to jump to the terminal where an agent is running."
        NSMicrophoneUsageDescription: "Giraffy uses the microphone when you dictate, and to note your calls when you ask it to."
        NSAudioCaptureUsageDescription: "Giraffy records what your Mac plays only while you note a call, to write down what the other people say."
        NSSpeechRecognitionUsageDescription: "Giraffy turns your voice into the text of a chat message."
        NSAccessibilityUsageDescription: "Giraffy reads the title of the active window to attach it as context."
        NSContactsUsageDescription: "Giraffy looks up an email address when you ask it, by voice, to prepare an email."
        NSFocusStatusUsageDescription: "Giraffy stays quiet while a Focus is on."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - de
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - th
          - tr
          - zh-Hans
          - zh-Hant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.purplegiraffe.Giraffy
        PRODUCT_NAME: Giraffy
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
    dependencies:
      - package: FluidAudio
    postBuildScripts:
      - name: "Write Git Hash to Info.plist"
        script: |
          HASH=$(git -C "${SRCROOT}/.." rev-parse --short HEAD 2>/dev/null || echo "unknown")
          /usr/libexec/PlistBuddy -c "Set :CoucouGitHash ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CoucouGitHash string ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        showEnvVars: false
